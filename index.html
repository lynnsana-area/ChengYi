<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聽見羅東 × 認識自己 — 薛呈懿政治人格測驗</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:118%;}
html,body{width:100%;height:100%;overflow:hidden;background:#07101f;font-family:'Microsoft JhengHei','微軟正黑體','PingFang TC',sans-serif;color:#fff;}

/* ── WRAPPER ── */
#wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
#game{
  position:relative;width:min(100vw,480px);height:min(100vh,860px);
  overflow:hidden;background:#07101f;
}

/* ── SCREENS (stacked, shown/hidden by .active) ── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s;}
.screen.active{opacity:1;pointer-events:all;}

/* ═══════════════════════════════════════
   INTRO SCREEN
═══════════════════════════════════════ */
#s-intro{
  background:radial-gradient(ellipse at 50% 30%, #0e2a1a 0%, #07101f 70%);
  padding:40px 32px;gap:18px;text-align:center;
}
#s-intro .logo{font-size:3rem;}
#s-intro h1{font-size:1.7rem;line-height:1.4;color:#4ecca3;text-shadow:0 0 24px rgba(78,204,163,.5);}
#s-intro h1 span{font-size:1rem;color:#ccc;display:block;margin-top:4px;letter-spacing:1px;}
#s-intro p{font-size:.88rem;color:#bbb;line-height:1.8;max-width:320px;}
.btn-primary{
  padding:14px 44px;background:linear-gradient(135deg,#4ecca3,#2a8a7a);
  border:none;border-radius:50px;color:#07101f;font-size:1.05rem;font-weight:900;
  font-family:inherit;cursor:pointer;box-shadow:0 4px 24px rgba(78,204,163,.35);
  transition:transform .18s,box-shadow .18s;
}
.btn-primary:hover{transform:scale(1.05);box-shadow:0 6px 32px rgba(78,204,163,.55);}
.btn-primary:active{transform:scale(.97);}

/* ═══════════════════════════════════════
   GAME SCENE (road + character)
═══════════════════════════════════════ */
#s-game{flex-direction:column;justify-content:flex-start;padding:0;}

/* Sky */
#sky{
  position:absolute;top:0;left:0;right:0;height:45%;
  background:linear-gradient(180deg,#040810 0%,#0a1a30 55%,#0e2a1a 100%);
}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

/* City silhouette */
#cityline{
  position:absolute;bottom:0;left:0;right:0;height:70px;
  background:#07101f;
  clip-path:polygon(
    0% 100%, 0% 60%, 4% 60%, 4% 40%, 7% 40%, 7% 55%, 11% 55%, 11% 30%,
    13% 30%, 13% 45%, 16% 45%, 16% 25%, 18% 25%, 18% 45%, 21% 45%,
    21% 15%, 23% 15%, 23% 45%, 25% 45%, 25% 35%, 28% 35%, 28% 50%,
    32% 50%, 32% 20%, 35% 20%, 35% 50%, 37% 50%, 37% 35%, 40% 35%,
    40% 55%, 44% 55%, 44% 25%, 47% 25%, 47% 55%, 50% 55%,
    50% 40%, 53% 40%, 53% 20%, 56% 20%, 56% 40%, 58% 40%, 58% 50%,
    62% 50%, 62% 30%, 65% 30%, 65% 50%, 68% 50%, 68% 38%,
    71% 38%, 71% 55%, 75% 55%, 75% 28%, 78% 28%, 78% 55%,
    81% 55%, 81% 42%, 85% 42%, 85% 58%, 89% 58%, 89% 35%,
    92% 35%, 92% 58%, 95% 58%, 95% 45%, 98% 45%, 98% 60%, 100% 60%,
    100% 100%
  );
}

/* Ground */
#ground{
  position:absolute;bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(180deg,#0e2010 0%,#142a14 100%);
}

/* Road */
#road{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:130px;height:42%;
  background:#1e1e1e;
}
#road::before{/* left edge */
  content:'';position:absolute;top:0;bottom:0;left:6px;width:3px;
  background:repeating-linear-gradient(to bottom,#fff4 0,#fff4 18px,transparent 18px,transparent 36px);
  animation:rscroll .5s linear infinite;
}
#road::after{/* right edge */
  content:'';position:absolute;top:0;bottom:0;right:6px;width:3px;
  background:repeating-linear-gradient(to bottom,#fff4 0,#fff4 18px,transparent 18px,transparent 36px);
  animation:rscroll .5s linear infinite;
}
#road-center{
  position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:4px;
  background:repeating-linear-gradient(to bottom,#ffd70099 0,#ffd70099 16px,transparent 16px,transparent 32px);
  animation:rscroll .5s linear infinite;
}
@keyframes rscroll{from{background-position:0 0}to{background-position:0 36px}}

/* Trees (generated by JS) */
.tree{position:absolute;display:flex;flex-direction:column;align-items:center;animation:treeFlow linear infinite;}
.tree-top{background:#1e5c1e;clip-path:polygon(50% 0%,0% 100%,100% 100%);}
.tree-trunk{background:#5a3010;}
@keyframes treeFlow{from{transform:translateY(-60px)}to{transform:translateY(calc(100% + 60px))}}

/* Progress */
#progress{
  position:absolute;top:14px;left:0;right:0;display:flex;
  justify-content:center;gap:10px;z-index:80;
}
.pdot{
  width:13px;height:13px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);
  transition:all .4s;
}
.pdot.active{border-color:#4ecca3;background:rgba(78,204,163,.25);box-shadow:0 0 8px rgba(78,204,163,.5);}
.pdot.done{border-color:#4ecca3;background:#4ecca3;box-shadow:0 0 12px rgba(78,204,163,.7);}

/* Character */
#char-wrap{
  position:absolute;bottom:41%;left:50%;transform:translateX(-50%);
  z-index:60;transition:bottom .9s ease;
}
#char{width:52px;height:78px;}
.walking .leg-l{animation:legA .4s ease-in-out infinite alternate;transform-origin:50% 0;}
.walking .leg-r{animation:legA .4s ease-in-out infinite alternate-reverse;transform-origin:50% 0;}
.walking .arm-l{animation:armA .4s ease-in-out infinite alternate-reverse;transform-origin:50% 0;}
.walking .arm-r{animation:armA .4s ease-in-out infinite alternate;transform-origin:50% 0;}
.walking{animation:bodyBob .4s ease-in-out infinite alternate;}
@keyframes legA{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes armA{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes bodyBob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-22px) scale(1.1)}60%{transform:translateY(0) scale(1)}80%{transform:translateY(-10px) scale(1.05)}100%{transform:translateY(0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.jumping{animation:jump .7s ease-in-out;}
.shaking{animation:shake .45s ease-in-out;}

/* Speech bubble */
#bubble{
  position:absolute;bottom:calc(41% + 82px);left:50%;
  transform:translateX(-50%) scale(.85);transform-origin:bottom center;
  background:#fff;color:#1a1a1a;border-radius:14px;padding:10px 14px;
  font-size:.75rem;line-height:1.5;text-align:center;max-width:220px;
  white-space:nowrap;z-index:70;
  box-shadow:0 4px 16px rgba(0,0,0,.35);
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
}
#bubble::after{
  content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:8px solid #fff;
}
#bubble.show{opacity:1;transform:translateX(-50%) scale(1);}

/* Status label */
#status{
  position:absolute;top:50px;left:0;right:0;text-align:center;
  font-size:.82rem;color:#4ecca3;letter-spacing:1px;z-index:70;
  opacity:0;transition:opacity .4s;
}

/* ═══════════════════════════════════════
   QUESTION OVERLAY
═══════════════════════════════════════ */
#s-question{
  background:rgba(4,10,26,.93);backdrop-filter:blur(6px);
  padding:20px 18px;gap:16px;justify-content:flex-start;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
}
#q-label{font-size:.7rem;letter-spacing:4px;color:#4ecca3;text-transform:uppercase;}
#q-icon{font-size:2.2rem;}
#q-text{
  font-size:1.02rem;font-weight:700;color:#f0f0f0;line-height:1.6;
  text-align:center;max-width:340px;
}

/* Crossroad grid */
#crossroad{
  position:relative;display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:10px;width:320px;height:310px;
}
/* Road lines in gap (pseudo-element overlay) */
#crossroad::before{
  content:'';position:absolute;
  top:50%;left:0;right:0;height:10px;
  transform:translateY(-50%);
  background:#1e1e1e;z-index:1;pointer-events:none;
}
#crossroad::after{
  content:'';position:absolute;
  left:50%;top:0;bottom:0;width:10px;
  transform:translateX(-50%);
  background:#1e1e1e;z-index:1;pointer-events:none;
}
/* Center dot */
#cross-center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:42px;height:42px;border-radius:50%;
  background:#1e1e1e;border:2px solid #333;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;z-index:2;pointer-events:none;
}

.opt{
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.12);
  border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;padding:12px 10px;gap:6px;
  transition:background .2s,border-color .2s,transform .15s;
  position:relative;z-index:3;
  overflow:hidden;
}
.opt:hover{background:rgba(78,204,163,.08);border-color:rgba(78,204,163,.4);transform:scale(1.02);}
.opt:active{transform:scale(.97);}
.opt.chosen{background:rgba(78,204,163,.15) !important;border-color:#4ecca3 !important;}
.opt.wrong{background:rgba(231,76,60,.12) !important;border-color:#e74c3c !important;}
.opt-dir{font-size:.75rem;font-weight:900;color:#4ecca388;letter-spacing:2px;}
.opt-arrow{font-size:1rem;position:absolute;top:10px;right:10px;opacity:.3;}
.opt-text{font-size:.76rem;color:#ddd;line-height:1.5;flex:1;}
/* Ripple on click */
.opt-ripple{
  position:absolute;border-radius:50%;background:rgba(78,204,163,.25);
  transform:scale(0);animation:ripple .5s ease-out;pointer-events:none;
}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* ═══════════════════════════════════════
   RESULT SCREEN
═══════════════════════════════════════ */
#s-result{
  background:radial-gradient(ellipse at 50% 30%,#1a0a3a 0%,#07101f 70%);
  padding:30px 28px;gap:0;
  justify-content:flex-start;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
}
.result-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.rp{position:absolute;border-radius:50%;animation:floatUp linear infinite;}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:.8}100%{transform:translateY(-110vh) rotate(720deg);opacity:0}}

#result-badge{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:fadeUp .8s ease-out both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

#mbti-type{
  font-size:3.2rem;font-weight:900;letter-spacing:10px;
  text-shadow:0 0 30px currentColor;
  animation:typePulse 2.5s ease-in-out infinite;
}
@keyframes typePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}

#type-name{
  font-size:1rem;letter-spacing:3px;color:#ffd700;
  text-shadow:0 0 14px rgba(255,215,0,.6);
  font-weight:700;
}
.type-emoji{font-size:2.2rem;}

/* Card */
#type-card{
  position:relative;z-index:2;
  width:min(320px,88vw);margin-top:16px;
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(78,204,163,.06));
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:20px 22px;
  box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
  animation:fadeUp .8s ease-out .3s both;
  /* rainbow border glow */
  background-clip:padding-box;
}
#type-card::before{
  content:'';position:absolute;inset:-1.5px;border-radius:21px;
  background:conic-gradient(from 0deg,#4ecca3,#ffd700,#9b59b6,#e74c3c,#4ecca3);
  z-index:-1;opacity:.5;animation:rotateBorder 6s linear infinite;
}
@keyframes rotateBorder{to{transform:rotate(360deg)}}

.card-section{margin-bottom:14px;}
.card-section:last-child{margin-bottom:0;}
.card-label{
  font-size:.62rem;letter-spacing:3px;color:#4ecca388;text-transform:uppercase;
  margin-bottom:5px;
}
.card-body{font-size:.82rem;color:#ddd;line-height:1.7;}
.card-quote{
  font-size:.8rem;color:#4ecca3;font-style:italic;line-height:1.6;
  border-left:2px solid #4ecca3;padding-left:10px;
}
.card-connect{font-size:.78rem;color:#ccc;line-height:1.7;}

/* Stat bars */
#dim-bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.dim-row{display:flex;flex-direction:column;gap:3px;}
.dim-label{font-size:.6rem;color:#aaa;display:flex;justify-content:space-between;}
.dim-track{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.dim-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#4ecca3,#ffd700);animation:barLoad 1s ease-out both;}
@keyframes barLoad{from{width:0}}

#cta-area{
  position:relative;z-index:2;margin-top:20px;display:flex;flex-direction:column;
  align-items:center;gap:10px;animation:fadeUp .8s ease-out .6s both;width:100%;
}
.share-note{font-size:.72rem;color:#888;text-align:center;line-height:1.5;}
.btn-outline{
  padding:10px 32px;background:transparent;border:1.5px solid #4ecca3;
  border-radius:50px;color:#4ecca3;font-size:.88rem;font-weight:700;
  font-family:inherit;cursor:pointer;transition:all .2s;
}
.btn-outline:hover{background:#4ecca3;color:#07101f;}

/* ── FLASH ── */
#flash{
  position:absolute;inset:0;background:#fff;opacity:0;
  pointer-events:none;z-index:999;transition:opacity .2s;
}
</style>
</head>

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let qIdx = 0;
let scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
let locked = false;
let treeTimer = null;

// ═══════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function flash(cb){
  const f=document.getElementById('flash');
  f.style.opacity='1';
  setTimeout(()=>{f.style.opacity='0';cb&&cb();},250);
}
function setStatus(msg,dur=1600){
  const el=document.getElementById('status');
  el.textContent=msg;el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',dur);
}
function showBubble(msg){
  const b=document.getElementById('bubble');
  b.textContent=msg;b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),2200);
}
function updateDots(){
  for(let i=0;i<5;i++){
    const d=document.getElementById('d'+i);
    d.className='pdot'+(i<qIdx?' done':i===qIdx?' active':'');
  }
}

// ═══════════════════════════════════════
//  TREE ANIMATION
// ═══════════════════════════════════════
function spawnTree(){
  const game=document.getElementById('s-game');
  const roadX=document.getElementById('road').getBoundingClientRect();
  const gameRect=document.getElementById('game').getBoundingClientRect();
  const roadLeft=(roadX.left-gameRect.left)/gameRect.width*100;
  const roadRight=(roadX.right-gameRect.left)/gameRect.width*100;

  const side=Math.random()<.5?'left':'right';
  const t=document.createElement('div');
  t.className='tree';
  const h=28+Math.random()*16;
  const top=document.createElement('div');
  top.className='tree-top';
  top.style.cssText=`width:${h*.8}px;height:${h}px`;
  const trunk=document.createElement('div');
  trunk.className='tree-trunk';
  trunk.style.cssText=`width:${h*.2}px;height:${h*.4}px`;
  t.appendChild(top);t.appendChild(trunk);

  const dur=3+Math.random()*2;
  if(side==='left'){
    t.style.left=(roadLeft-8-Math.random()*8)+'%';
  } else {
    t.style.left=(roadRight+2+Math.random()*6)+'%';
  }
  t.style.top='-60px';
  t.style.animationDuration=dur+'s';
  t.style.animationDelay='0s';
  game.appendChild(t);
  setTimeout(()=>t.remove(),dur*1000+500);
}
function startTrees(){treeTimer=setInterval(spawnTree,600);}
function stopTrees(){clearInterval(treeTimer);treeTimer=null;}

// ═══════════════════════════════════════
//  GENERATE STARS
// ═══════════════════════════════════════
function makeStars(){
  const sky=document.getElementById('sky');
  for(let i=0;i<50;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+.8;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*85}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s`;
    sky.appendChild(s);
  }
}

// ═══════════════════════════════════════
//  START GAME
// ═══════════════════════════════════════
function startGame(){
  qIdx=0;
  scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  locked=false;
  makeStars();
  flash(()=>{
    show('s-game');
    updateDots();
    startTrees();
    setTimeout(()=>showQuestion(),900);
  });
}

// ═══════════════════════════════════════
//  SHOW QUESTION
// ═══════════════════════════════════════
function showQuestion(){
  const q=Qs[qIdx];
  document.getElementById('q-num').textContent=qIdx+1;
  document.getElementById('q-icon').textContent=q.icon;
  document.getElementById('q-text').textContent=q.text;
  q.opts.forEach((o,i)=>{document.getElementById('ot'+i).textContent=o.t;});
  // Reset styles
  for(let i=0;i<4;i++){
    const el=document.getElementById('opt'+i);
    el.className='opt';
    el.style.pointerEvents='';
    el.style.opacity='1';
  }
  locked=false;
  flash(()=>show('s-question'));
}

// ═══════════════════════════════════════
//  PICK ANSWER
// ═══════════════════════════════════════
function pick(idx,ev){
  if(locked)return;
  locked=true;

  // Ripple effect
  const btn=document.getElementById('opt'+idx);
  const r=document.createElement('div');
  r.className='opt-ripple';
  const rect=btn.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height)*2;
  r.style.cssText=`width:${size}px;height:${size}px;left:${ev.clientX-rect.left-size/2}px;top:${ev.clientY-rect.top-size/2}px`;
  btn.appendChild(r);
  setTimeout(()=>r.remove(),500);

  // Mark chosen
  btn.classList.add('chosen');
  for(let i=0;i<4;i++) document.getElementById('opt'+i).style.pointerEvents='none';

  // Add scores
  const sc=Qs[qIdx].opts[idx].sc;
  Object.entries(sc).forEach(([k,v])=>scores[k]=(scores[k]||0)+v);

  // Show insight
  const ins=Qs[qIdx].opts[idx].ins;
  setTimeout(()=>{
    flash(()=>{
      show('s-game');
      // animate char
      const char=document.getElementById('char');
      char.classList.remove('walking');
      void char.offsetWidth;
      char.classList.add('jumping','walking');
      setTimeout(()=>char.classList.remove('jumping'),800);
      showBubble(ins);
      updateDots();
      setStatus('繼續前進…',1400);
      qIdx++;
      if(qIdx>=5){
        setTimeout(()=>{stopTrees();showResult();},1800);
      } else {
        setTimeout(()=>showQuestion(),1900);
      }
    });
  },350);
}

// ═══════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════
function calcMBTI(){
  const ei=scores.E>=scores.I?'E':'I';
  const sn=scores.S>=scores.N?'S':'N';
  const tf=scores.T>=scores.F?'T':'F';
  const jp=scores.J>=scores.P?'J':'P';
  return ei+sn+tf+jp;
}

function showResult(){
  const type=calcMBTI();
  const data=MBTI[type];

  // Set color theme
  document.getElementById('mbti-type').style.color=data.color;
  document.getElementById('mbti-type').style.textShadow=`0 0 30px ${data.color}`;
  document.getElementById('mbti-type').textContent=type;
  document.getElementById('type-emoji').textContent=data.emoji;
  document.getElementById('type-name').textContent=data.name;
  document.getElementById('type-desc').textContent=data.desc;
  document.getElementById('type-connect').textContent=data.connect;
  document.getElementById('type-quote').textContent=data.quote;

  // Dimension bars
  const total=5; // approx scale
  const eiScore=scores.E/(scores.E+scores.I+.01);
  const snScore=scores.S/(scores.S+scores.N+.01);
  const tfScore=scores.T/(scores.T+scores.F+.01);
  const jpScore=scores.J/(scores.J+scores.P+.01);

  setDimBar('ei',eiScore,type[0]==='E'?'E':'I',type[0]==='E'?'I':'E');
  setDimBar('sn',snScore,type[1]==='S'?'S':'N',type[1]==='S'?'N':'S');
  setDimBar('tf',tfScore,type[2]==='T'?'T':'F',type[2]==='T'?'F':'T');
  setDimBar('jp',jpScore,type[3]==='J'?'J':'P',type[3]==='J'?'P':'J');

  // Particles
  spawnResultParticles(data.color);

  flash(()=>show('s-result'));
}

function setDimBar(id,ratio,labelL,labelR){
  document.getElementById('dl-'+id+'-l').textContent=labelL;
  document.getElementById('dl-'+id+'-r').textContent=labelR;
  const pct=Math.round(ratio*100);
  const fill=document.getElementById('df-'+id);
  fill.style.width=Math.max(10,Math.min(90,pct))+'%';
  fill.style.animationDelay=Math.random()*.3+'s';
}

function spawnResultParticles(mainColor){
  const container=document.getElementById('rp-container');
  container.innerHTML='';
  const colors=[mainColor,'#ffd700','#4ecca3','#fff','#e74c3c','#9b59b6'];
  for(let i=0;i<25;i++){
    const p=document.createElement('div');
    p.className='rp';
    const sz=4+Math.random()*8;
    p.style.cssText=`
      width:${sz}px;height:${sz}px;
      left:${Math.random()*100}%;
      bottom:${Math.random()*20}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${3+Math.random()*3}s;
      animation-delay:${Math.random()*3}s;
    `;
    container.appendChild(p);
  }
}

function restartGame(){
  stopTrees();
  document.getElementById('sky').innerHTML='';
  document.getElementById('s-game').querySelectorAll('.tree').forEach(t=>t.remove());
  flash(()=>{
    show('s-intro');
  });
}
